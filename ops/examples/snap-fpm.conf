; Two pools in a dedicated PHP-FPM instance, owned by an unprivileged snap account.
; Socket group "caddy" assumes that is the actual Caddy group; verify first.
; Pool sizes are initial limits, not measured capacity or acceptance evidence.
[snap-public]
user = snap
group = snap
listen = /run/php/snap-public.sock
listen.owner = snap
listen.group = caddy
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 300
request_terminate_timeout = 60s
clear_env = yes
catch_workers_output = yes
security.limit_extensions = .php
env[SNAP_INTERNAL_ORIGIN] = http://127.0.0.1:9081
env[SNAP_INTERNAL_HOST] = snap.example.com
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[default_socket_timeout] = 25
php_admin_value[max_execution_time] = 50
php_admin_value[upload_tmp_dir] = /var/lib/dokitool/tmp
php_admin_value[session.save_path] = /var/lib/dokitool/tmp
php_admin_value[open_basedir] = /srv/dokitool:/var/lib/dokitool:/etc/ssl/certs:/usr/share/ca-certificates

[snap-internal]
user = snap
group = snap
listen = /run/php/snap-internal.sock
listen.owner = snap
listen.group = caddy
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 300
request_terminate_timeout = 50s
clear_env = yes
catch_workers_output = yes
security.limit_extensions = .php
env[SNAP_INTERNAL_HOST] = snap.example.com
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M
php_admin_value[default_socket_timeout] = 25
php_admin_value[max_execution_time] = 45
php_admin_value[upload_tmp_dir] = /var/lib/dokitool/tmp
php_admin_value[session.save_path] = /var/lib/dokitool/tmp
php_admin_value[open_basedir] = /srv/dokitool:/var/lib/dokitool:/etc/ssl/certs:/usr/share/ca-certificates
